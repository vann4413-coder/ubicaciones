# Despliegue en Render (https://render.com): Blueprint con un servicio web Docker.
services:
  - type: web
    name: ubicaciones
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: UBI_MARCA
        value: Parcelas 360
      - key: UBI_MARCA_LEMA
        value: Informe de idoneidad de ubicaciones
      - key: ANTHROPIC_API_KEY
        sync: false
